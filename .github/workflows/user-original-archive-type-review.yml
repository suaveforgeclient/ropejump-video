name: ROPEJUMP USER_ORIGINAL archive type review

on:
  push:
    paths:
      - ".github/workflows/user-original-archive-type-review.yml"

permissions:
  contents: read
  actions: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install media tools
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
          python -m pip install -q --disable-pip-version-check pillow yt-dlp
      - name: Download known archive videos and build dense type evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json,math,subprocess,shutil
          from pathlib import Path
          from PIL import Image,ImageDraw
          items=[
            ("JR-20260908-E86C659B","_N1v6StHvHw"),
            ("JR-20260908-376EF057","6SOmh1SKoww"),
            ("JR-20260909-9BDBF573","L471CaU1RCc"),
            ("JR-20260909-AC5539AF","iyzPx8bNRws"),
            ("JR-20260911-BD41E9A3","wIPDBjbiRJs"),
            ("JR-20260908-F62DC60E","XSdOAeM5Y5g"),
            ("JR-20260910-07583788","j3yEbDcoMSI"),
            ("JR-20260908-913C26E0","DA2zlbnFJjI"),
            ("JR-20260908-F45E4935","iLjPfDfgzMA"),
            ("JR-20260910-C32FED68","9ZjUVl3h3II"),
          ]
          out=Path("out"); out.mkdir()
          rows=[]
          for public_id,yid in items:
            d=out/public_id; d.mkdir()
            subprocess.run(["python","-m","yt_dlp","--no-playlist","--no-progress","--retries","3","--fragment-retries","3",
              "-f","bv*[height<=720]+ba/b[height<=720]","--merge-output-format","mp4",
              "-o",str(d/"source.%(ext)s"),f"https://www.youtube.com/watch?v={yid}"],check=True)
            files=[p for p in d.glob("source.*") if p.suffix not in {".part",".ytdl"}]
            src=next((p for p in files if p.suffix==".mp4"),files[0])
            if src.suffix!=".mp4":
              mp4=d/"source.mp4"; subprocess.run(["ffmpeg","-hide_banner","-loglevel","error","-y","-i",str(src),"-c","copy",str(mp4)],check=True); src.unlink(); src=mp4
            probe=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_entries","format=duration,size","-show_entries","stream=codec_type,width,height,r_frame_rate","-of","json",str(src)]))
            frames=d/"frames15"; frames.mkdir()
            subprocess.run(["ffmpeg","-hide_banner","-loglevel","error","-y","-i",str(src),"-vf","fps=15,scale=560:-2:flags=lanczos","-q:v","3",str(frames/"f_%05d.jpg")],check=True)
            jpgs=sorted(frames.glob("*.jpg"))
            def make(mode):
              dest=d/mode; dest.mkdir(); per=24; cols=4; cw=360; ch=310 if mode=="full" else 270; names=[]
              for st in range(0,len(jpgs),per):
                chunk=jpgs[st:st+per]; rr=math.ceil(len(chunk)/cols)
                canvas=Image.new("RGB",(cols*cw,rr*ch),"white"); draw=ImageDraw.Draw(canvas)
                for j,p in enumerate(chunk):
                  im=Image.open(p).convert("RGB")
                  if mode=="lower":
                    w,h=im.size; im=im.crop((0,int(h*.28),w,h))
                  im.thumbnail((350,260 if mode=="full" else 220))
                  x=(j%cols)*cw+(cw-im.width)//2; y=(j//cols)*ch+30+(240-im.height)//2
                  canvas.paste(im,(x,y)); n=int(p.stem.split("_")[-1])
                  draw.text(((j%cols)*cw+6,(j//cols)*ch+6),f"{(n-1)/15:.2f}s",fill="black")
                op=dest/f"sheet_{st//per+1:03d}.jpg"; canvas.save(op,quality=89); names.append(str(op.relative_to(out)))
              return names
            full=make("full"); lower=make("lower"); shutil.rmtree(frames); src.unlink()
            rows.append({"id":public_id,"youtubeId":yid,"archiveOnlyForTypeReview":True,"evidenceFps":15,"fullSheets":full,"lowerSheets":lower,"probe":probe})
          (out/"manifest.json").write_text(json.dumps({"schemaVersion":1,"purpose":"direct visual STANDARD purity review of known USER_ORIGINAL archive copies; counts remain exact locked USER_ORIGINAL GT","rows":rows},indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: user-original-archive-type-review
          path: out/
          retention-days: 2
          compression-level: 0
