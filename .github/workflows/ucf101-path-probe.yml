name: ROPEJUMP UCF101 path probe

on:
  push:
    paths:
      - ".github/workflows/ucf101-path-probe.yml"

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q --disable-pip-version-check huggingface_hub
      - name: Probe UCF101 mirror layouts without downloading archives
        run: |
          set -Eeuo pipefail
          mkdir -p out
          python - <<'PY'
          import json
          from pathlib import Path
          from huggingface_hub import HfApi
          api=HfApi()
          repos=["bitmind/UCF101-Videos","bitmind/UCF101Fullvideo","BDeng/UCF-101","flwrlabs/ucf101"]
          payload={"repos":[]}
          for repo in repos:
              rec={"repo":repo}
              try:
                  files=api.list_repo_files(repo_id=repo, repo_type="dataset")
                  rec["totalFiles"]=len(files)
                  rec["jumpRopeMatches"]=[f for f in files if "jumprope" in f.lower()][:200]
                  rec["archiveLike"]=[f for f in files if f.lower().endswith((".rar",".zip",".tar",".tar.gz",".tgz"))][:50]
                  rec["samples"]=files[:40]
              except Exception as e:
                  rec["error"]=repr(e)
              payload["repos"].append(rec)
          Path("out/path-probe.json").write_text(json.dumps(payload,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(payload,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ucf101-path-probe
          path: out/
          retention-days: 2
