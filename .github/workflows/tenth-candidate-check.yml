name: ROPEJUMP tenth candidate check

on:
  push:
    paths:
      - ".github/workflows/tenth-candidate-check.yml"

permissions:
  actions: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - id: x7zu1yk
            title: "Guy Works Out Using Jump Rope"
          - id: x80l4c1
            title: "Guy Trains To Speed Jump Rope"
          - id: x82izc1
            title: "Playing jumping rope"
          - id: x4htk8n
            title: "Total Knockout: Martha Hunt (Jump Rope)"
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y ffmpeg >/dev/null
          python -m pip install --disable-pip-version-check --no-cache-dir -U yt-dlp >/dev/null
      - name: Download full candidate
        env:
          ID: ${{ matrix.id }}
        run: |
          set -Eeuo pipefail
          mkdir -p out
          python -m yt_dlp --no-playlist --no-progress --retries 3 --fragment-retries 3             -f "bv*[height<=720]+ba/b[height<=720]" --merge-output-format mp4             -o "out/$ID.%(ext)s" "https://www.dailymotion.com/video/$ID"
          file="$(find out -maxdepth 1 -type f -name "$ID.*" ! -name '*.part' | head -n1)"
          test -n "$file"
          if [ "${file##*.}" != "mp4" ]; then ffmpeg -hide_banner -loglevel error -y -i "$file" -c copy "out/$ID.mp4"; rm -f "$file"; file="out/$ID.mp4"; fi
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_type,codec_name,width,height,r_frame_rate -of json "$file" > "out/$ID.ffprobe.json"
          sha256sum "$file" > "out/$ID.sha256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: tenth-${{ matrix.id }}
          path: out/
          retention-days: 3
          compression-level: 0
