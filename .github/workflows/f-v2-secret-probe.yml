name: F V2 secret presence probe
on:
  push:
    branches:
      - research/f-v2-exec
    paths:
      - '.github/workflows/f-v2-secret-probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe secret presence only
        shell: bash
        env:
          A: ${{ secrets.SSH_HOST }}
          B: ${{ secrets.SSH_PORT }}
          C: ${{ secrets.SSH_USER }}
          D: ${{ secrets.SSH_PASS }}
          E: ${{ secrets.SSH_PASSWORD }}
          F: ${{ secrets.SERVER_HOST }}
          G: ${{ secrets.SERVER_PORT }}
          H: ${{ secrets.SERVER_USER }}
          I: ${{ secrets.SERVER_PASSWORD }}
          J: ${{ secrets.SERVER123_SSH_PASS }}
          K: ${{ secrets.JUMPROPE_CANONICAL_SSH_PASS }}
          L: ${{ secrets.REMOTE_MINUTE_CACHE_SSH_PASS }}
        run: |
          set -Eeuo pipefail
          yn(){ if [ -n "$2" ]; then echo "$1=yes"; else echo "$1=no"; fi; }
          yn SSH_HOST "$A"
          yn SSH_PORT "$B"
          yn SSH_USER "$C"
          yn SSH_PASS "$D"
          yn SSH_PASSWORD "$E"
          yn SERVER_HOST "$F"
          yn SERVER_PORT "$G"
          yn SERVER_USER "$H"
          yn SERVER_PASSWORD "$I"
          yn SERVER123_SSH_PASS "$J"
          yn JUMPROPE_CANONICAL_SSH_PASS "$K"
          yn REMOTE_MINUTE_CACHE_SSH_PASS "$L"
