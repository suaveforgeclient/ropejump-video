name: ROPEJUMP UCF101 STANDARD pilot

on:
  push:
    paths:
      - ".github/workflows/ucf101-standard-pilot.yml"
      - "scripts/ucf101-jumprope-collector.py"

permissions:
  contents: read
  actions: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install media tools
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
          python -m pip install -q --disable-pip-version-check pillow remotezip

      - name: Collect diverse JumpRope class pilot by selective range
        run: |
          set -Eeuo pipefail
          python scripts/ucf101-jumprope-collector.py --out collected --limit 20
          python - <<'PY'
          import json
          d=json.load(open("collected/manifest.json"))
          print(json.dumps({"selected":d["selectedCount"],"downloaded":d["downloadedCount"]}))
          if d["selectedCount"] != 20 or d["downloadedCount"] != d["selectedCount"]:
              raise SystemExit("UCF101_PILOT_INCOMPLETE")
          PY

      - name: Build exact-hash visual-review evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          from PIL import Image, ImageDraw

          root=Path("collected")
          manifest=json.loads((root/"manifest.json").read_text())
          review=Path("review"); review.mkdir(exist_ok=True)
          results=[]

          for row in manifest["rows"]:
              rec={k:row.get(k) for k in [
                  "filename","group","clip","split","archiveEntry","sourceRef","sha256","bytes","downloadOk",
                  "dataset","datasetClass","targetType","typeStatus","contentStatus","countStatus"
              ]}
              if not row.get("downloadOk"):
                  results.append(rec); continue

              src=root/row["filename"]
              d=review/src.stem
              d.mkdir(parents=True,exist_ok=True)

              probe=subprocess.run([
                  "ffprobe","-v","error","-show_entries",
                  "format=duration,size,format_name:stream=index,codec_type,codec_name,width,height,avg_frame_rate,r_frame_rate",
                  "-of","json",str(src)
              ],text=True,capture_output=True,check=True)
              (d/"ffprobe.json").write_text(probe.stdout or "{}")

              frames=d/"frames4fps"; frames.mkdir(exist_ok=True)
              subprocess.run([
                  "ffmpeg","-hide_banner","-loglevel","error","-y","-i",str(src),
                  "-vf","fps=4,scale=480:-2:flags=lanczos",
                  "-q:v","3",str(frames/"f_%05d.jpg")
              ],check=True)

              jpgs=sorted(frames.glob("*.jpg"))
              pages=[]
              for start in range(0,len(jpgs),20):
                  chunk=jpgs[start:start+20]
                  canvas=Image.new("RGB",(2500,1200),"white")
                  for j,jpg in enumerate(chunk):
                      im=Image.open(jpg).convert("RGB")
                      im.thumbnail((480,250))
                      cell=Image.new("RGB",(500,300),"white")
                      x=(500-im.width)//2; y=25+(250-im.height)//2
                      cell.paste(im,(x,y))
                      frame_num=int(jpg.stem.split("_")[-1])
                      sec=(frame_num-1)/4.0
                      ImageDraw.Draw(cell).text((8,5),f"{sec:0.2f}s",fill="black")
                      canvas.paste(cell,((j%5)*500,(j//5)*300))
                  page=d/f"sheet_{start//20+1:02d}.jpg"
                  canvas.save(page,quality=88)
                  pages.append(page.name)

              rec.update({
                  "visualEvidenceFps":4,
                  "evidenceFrames":len(jpgs),
                  "sheets":pages,
                  "reviewPolicy":"No automatic subtype/content/count PASS. GPT visual review required."
              })
              results.append(rec)

          (review/"review-manifest.json").write_text(json.dumps({
              "schemaVersion":2,
              "targetType":"STANDARD_BASIC_SINGLE_UNDER",
              "datasetClass":"UCF101/JumpRope",
              "policy":{
                  "datasetClassDoesNotImplyStandard":True,
                  "pureStandardWholeSourceRequired":True,
                  "mixedTypeRejectFromPureStandardPool":True,
                  "countOnlyAfterTypeAndContentPass":True
              },
              "rows":results
          },ensure_ascii=False,indent=2)+"\n")
          print(json.dumps({
              "downloaded":sum(1 for x in results if x.get("downloadOk")),
              "reviewPackages":sum(1 for x in results if x.get("sheets"))
          }))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ucf101-standard-pilot
          path: |
            collected/manifest.json
            collected/*.avi
            review/
          retention-days: 2
