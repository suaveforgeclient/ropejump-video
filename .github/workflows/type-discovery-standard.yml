name: ROPEJUMP type discovery - standard

on:
  push:
    paths:
      - ".github/workflows/type-discovery-standard.yml"

permissions:
  contents: read
  actions: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Collect STANDARD jump-rope links automatically
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p out
          cat > /tmp/standard_discovery.py <<'PY'
          import html, json, re, time, urllib.parse, urllib.request
          from pathlib import Path

          UA={"User-Agent":"ROPEJUMP-research/2.0 (+automatic type discovery)"}
          TYPE="STANDARD_BASIC_SINGLE_UNDER"

          QUERIES=[
            "jump rope basic bounce",
            "jump rope basic jump two feet",
            "jump rope single under",
            "jump rope regular bounce",
            "basic skipping two feet",
            "skipping rope basic bounce",
            "skipping single bounce",
            "beginner jump rope basic bounce",
            "pular corda básico dois pés",
            "salto básico cuerda dos pies",
            "comba salto básico",
            "縄跳び 基本 前跳び",
            "줄넘기 기본 양발 뛰기",
            "줄넘기 기본 뛰기"
          ]

          # Metadata scoring only. Visual review is still required before PASS.
          STRONG=re.compile(
            r"(basic\s*(bounce|jump)|single\s*under|single\s*bounce|two[- ]?foot|two\s+feet|"
            r"regular\s*(bounce|jump)|basic\s*skipping|salto\s+b[aá]sico|b[aá]sico.*dos\s+pies|"
            r"pular\s+corda.*b[aá]sic|縄跳び.*(基本|前跳び)|줄넘기.*(기본|양발))", re.I)
          GENERAL=re.compile(
            r"(jump\s*rope|jumping\s*rope|skipping\s*rope|skip\s*rope|pular\s*corda|"
            r"saltar\s*(la\s*)?cuerda|comba|縄跳び|줄넘기)", re.I)
          OTHER_TYPE=re.compile(
            r"(double\s*under|triple\s*under|crossover|cross\s*over|criss\s*cross|"
            r"boxer\s*step|alternate\s*foot|alternating|running\s*step|high\s*knee|"
            r"side\s*swing|freestyle|trick|double\s*dutch|one[- ]?foot|release|mic\s*release|"
            r"toad|eb\b|frog|backward|speed\s*step|multiples|크로스|이중뛰기|엇걸어|번갈아)", re.I)
          NON_ACTIVITY=re.compile(
            r"(review|unbox|unboxing|podcast|interview|reaction|music\s*video|commercial|advert|"
            r"buying\s*guide|how\s*to\s*make|rope\s*making|product\s*only)", re.I)

          rows={}
          errors=[]

          def req_json(url, timeout=20):
            req=urllib.request.Request(url,headers=UA)
            with urllib.request.urlopen(req,timeout=timeout) as r:
              return json.loads(r.read().decode("utf-8","replace"))

          def req_text(url, timeout=20):
            req=urllib.request.Request(url,headers=UA)
            with urllib.request.urlopen(req,timeout=timeout) as r:
              return r.read().decode("utf-8","replace")

          def classify(text, query=""):
            t=(text or "")+" "+(query or "")
            if NON_ACTIVITY.search(t):
              return "METADATA_REJECT_NON_ACTIVITY", -5
            other=bool(OTHER_TYPE.search(text or ""))
            general=bool(GENERAL.search(text or ""))
            strong=bool(STRONG.search(text or "")) or bool(TWO_FEET_CONTEXT.search(text or ""))
            if other:
              return "OTHER_TYPE_EXPLICIT", -3
            # Type classification must come from source metadata itself.
            # Search-query wording is discovery context only and can NEVER create a STANDARD label.
            if general and strong:
              return "STANDARD_EXPLICIT_METADATA", 4
            if general:
              return "JUMPROPE_TYPE_UNKNOWN", 1
            return "METADATA_WEAK", 0

          def add(platform, keyid, title, url, desc="", query="", channel="", duration=None, media_url="", source_kind="api"):
            if not keyid or not url: return
            text=(title or "")+" "+(desc or "")
            gate,score=classify(text,query)
            key=f"{platform}:{keyid}"
            row={
              "key":key,"platform":platform,"id":str(keyid),"title":str(title or ""),
              "sourceUrl":str(url),"mediaUrl":str(media_url or ""),"duration":duration,
              "channel":str(channel or ""),"query":str(query or ""),"targetType":TYPE,
              "typeGate":gate,"typeScore":score,"sourceKind":source_kind,"queryIsDiscoveryOnly":True,
              "materialized":False,"visualStatus":"UNSCREENED"
            }
            old=rows.get(key)
            if old is None or row["typeScore"]>old.get("typeScore",-99):
              rows[key]=row

          # 1) Dailymotion public API
          for q in QUERIES:
            for page in range(1,6):
              params={
                "search":q,
                "fields":"id,title,url,duration,description,created_time,owner.screenname",
                "limit":"100","page":str(page)
              }
              u="https://api.dailymotion.com/videos?"+urllib.parse.urlencode(params)
              try: d=req_json(u,12)
              except Exception as e:
                errors.append(["dailymotion",q,page,repr(e)]); break
              for v in d.get("list",[]):
                vid=str(v.get("id") or "")
                dur=v.get("duration")
                if isinstance(dur,(int,float)) and (dur<3 or dur>240): continue
                add("dailymotion",vid,v.get("title"),v.get("url") or "https://www.dailymotion.com/video/"+vid,
                    v.get("description"),q,v.get("owner.screenname"),dur,source_kind="public_api")
              if not d.get("has_more"): break
              time.sleep(.08)

          # 2) Internet Archive
          for q in QUERIES:
            aq=f'(title:("{q}") OR description:("{q}")) AND mediatype:movies'
            pairs=[("q",aq),("fl[]","identifier"),("fl[]","title"),("fl[]","description"),
                   ("fl[]","creator"),("rows","200"),("page","1"),("output","json")]
            u="https://archive.org/advancedsearch.php?"+urllib.parse.urlencode(pairs)
            try: d=req_json(u,18)
            except Exception as e:
              errors.append(["internet_archive",q,repr(e)]); continue
            for x in ((d.get("response") or {}).get("docs") or []):
              ident=str(x.get("identifier") or "")
              add("internet_archive",ident,x.get("title"),"https://archive.org/details/"+ident,
                  x.get("description"),q,x.get("creator"),None,source_kind="public_api")

          # 3) Wikimedia Commons
          for q in QUERIES:
            p={
              "action":"query","format":"json","generator":"search","gsrnamespace":"6",
              "gsrsearch":q,"gsrlimit":"100","prop":"imageinfo",
              "iiprop":"url|mime|size|extmetadata"
            }
            try: d=req_json("https://commons.wikimedia.org/w/api.php?"+urllib.parse.urlencode(p),18)
            except Exception as e:
              errors.append(["wikimedia_commons",q,repr(e)]); continue
            for x in (d.get("query") or {}).get("pages",{}).values():
              ii=(x.get("imageinfo") or [{}])[0]
              if not str(ii.get("mime") or "").startswith("video/"): continue
              pid=str(x.get("pageid") or "")
              add("wikimedia_commons",pid,x.get("title"),ii.get("descriptionurl") or ii.get("url"),
                  "",q,"",None,ii.get("url") or "",source_kind="public_api")

          # 4) PeerTube search APIs: global endpoint first, stable public instance fallback.
          peertube_endpoints=[
            "https://search.joinpeertube.org/api/v1/search/videos",
            "https://peertube.cpy.re/api/v1/search/videos"
          ]
          for q in QUERIES:
            for endpoint in peertube_endpoints:
              try:
                d=req_json(endpoint+"?"+urllib.parse.urlencode({"search":q,"count":100,"start":0}),18)
              except Exception as e:
                errors.append(["peertube",endpoint,q,repr(e)]); continue
              for x in d.get("data",[]):
                uuid=str(x.get("uuid") or x.get("shortUUID") or x.get("id") or "")
                host=str(x.get("account",{}).get("host") or x.get("channel",{}).get("host") or "")
                url=str(x.get("url") or "")
                if not url and host and uuid:
                  url=f"https://{host}/w/{uuid}"
                if not url: continue
                add("peertube",uuid,x.get("name") or x.get("title"),url,x.get("description") or "",
                    q,(x.get("channel") or {}).get("displayName") or "",x.get("duration"),source_kind="federated_public_api")
              # one successful endpoint is enough per query
              if d.get("data"): break

          # 5) Reddit jump-rope communities. Collect Reddit-hosted and outbound video links automatically.
          for sub in ["jumprope","competitivejumprope"]:
            for q in ["basic bounce","single under","two feet","basic jump rope","regular jump"]:
              u=f"https://www.reddit.com/r/{sub}/search.json?"+urllib.parse.urlencode({
                "q":q,"restrict_sr":"1","sort":"relevance","t":"all","limit":"100","raw_json":"1"
              })
              try: d=req_json(u,18)
              except Exception as e:
                errors.append(["reddit",sub,q,repr(e)]); continue
              for c in ((d.get("data") or {}).get("children") or []):
                x=c.get("data") or {}
                pid=str(x.get("id") or "")
                permalink="https://www.reddit.com"+str(x.get("permalink") or "")
                target=str(x.get("url_overridden_by_dest") or x.get("url") or permalink)
                desc=str(x.get("selftext") or "")
                add("reddit_"+sub,pid,x.get("title"),target,desc,q,x.get("author") or "",None,
                    source_kind="community_search_api")

          # 6) Official federation/community page crawler.
          # These are source pools, not hand-picked videos.
          seeds=[
            ("ijru","https://ijru.sport/mediacontent"),
            ("ijru","https://ijru.sport/events"),
            ("reddit_jumprope","https://www.reddit.com/r/jumprope/"),
            ("reddit_competitivejumprope","https://www.reddit.com/r/competitivejumprope/")
          ]
          href_re=re.compile(r'href=["\']([^"\']+)["\']',re.I)
          videoish=re.compile(r"(video|watch|vimeo|dailymotion|instagram|tiktok|stream|reel|jump|rope|skip)",re.I)
          for label,seed in seeds:
            try: page=req_text(seed,18)
            except Exception as e:
              errors.append(["crawl",label,repr(e)]); continue
            for href in href_re.findall(page):
              href=html.unescape(href)
              url=urllib.parse.urljoin(seed,href)
              if not url.startswith("http") or not videoish.search(url): continue
              kid=re.sub(r"[^a-zA-Z0-9]+","_",url)[-120:]
              add("source_crawl_"+label,kid,url,url,"","basic jump rope","",None,source_kind="official_or_community_crawl")

          # 7) Web-link expansion for platforms without unauthenticated search APIs.
          # DuckDuckGo is used only to discover links; no result is treated as content-PASS.
          ddg_domains=["vimeo.com","instagram.com","tiktok.com","facebook.com","reddit.com/r/jumprope"]
          ddg_href=re.compile(r'<a[^>]+class="result__a"[^>]+href="([^"]+)"[^>]*>(.*?)</a>',re.I|re.S)
          strip_tags=re.compile(r"<[^>]+>")
          for domain in ddg_domains:
            for q in ["jump rope basic bounce","jump rope single under","basic skipping two feet"]:
              search=f"site:{domain} {q}"
              u="https://html.duckduckgo.com/html/?"+urllib.parse.urlencode({"q":search})
              try: page=req_text(u,15)
              except Exception as e:
                errors.append(["web_discovery",domain,q,repr(e)]); continue
              for href,label in ddg_href.findall(page):
                href=html.unescape(href)
                pu=urllib.parse.urlparse(href)
                qs=urllib.parse.parse_qs(pu.query)
                if "uddg" in qs: href=qs["uddg"][0]
                if domain not in href: continue
                title=html.unescape(strip_tags.sub("",label)).strip()
                kid=re.sub(r"[^a-zA-Z0-9]+","_",href)[-140:]
                add("web_"+domain.replace(".","_").replace("/","_"),kid,title,href,"",q,"",None,source_kind="web_link_discovery")
              time.sleep(.2)

          allrows=sorted(rows.values(),key=lambda x:(-x.get("typeScore",0),x["platform"],x["id"]))
          candidates=[x for x in allrows if x["typeGate"]=="STANDARD_EXPLICIT_METADATA"]
          unknown=[x for x in allrows if x["typeGate"]=="JUMPROPE_TYPE_UNKNOWN"]
          strong=candidates
          by_platform={}
          for x in allrows:
            p=x["platform"]
            by_platform.setdefault(p,{"total":0,"standardCandidates":0,"strong":0,"otherType":0,"rejected":0})
            by_platform[p]["total"]+=1
            if x in candidates: by_platform[p]["standardCandidates"]+=1
            if x["typeGate"]=="STANDARD_EXPLICIT_METADATA": by_platform[p]["strong"]+=1
            if x["typeGate"]=="OTHER_TYPE_EXPLICIT": by_platform[p]["otherType"]+=1
            if x["typeGate"].startswith("METADATA_REJECT"): by_platform[p]["rejected"]+=1

          payload={
            "schemaVersion":2,
            "collectorMode":"AUTOMATIC_TYPE_FIRST",
            "targetType":TYPE,
            "youtubeExcluded":True,
            "visualPassImplied":False,
            "queries":QUERIES,
            "totalUnique":len(allrows),
            "standardCandidates":len(candidates),
            "unknownJumpRopeType":len(unknown),
            "strongMetadataCandidates":len(strong),
            "stats":by_platform,
            "errors":errors,
            "rows":allrows
          }
          Path("out/standard-discovery.json").write_text(json.dumps(payload,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          Path("out/standard-candidates.jsonl").write_text("".join(json.dumps(x,ensure_ascii=False)+"\n" for x in candidates),encoding="utf-8")
          Path("out/summary.json").write_text(json.dumps({
            "targetType":TYPE,"totalUnique":len(allrows),"standardCandidates":len(candidates),
            "unknownJumpRopeType":len(unknown),"strongMetadataCandidates":len(strong),"stats":by_platform,"errorCount":len(errors)
          },ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(Path("out/summary.json").read_text())
          PY
          python /tmp/standard_discovery.py

      - uses: actions/upload-artifact@v4
        with:
          name: type-discovery-standard
          path: out/
          retention-days: 7
