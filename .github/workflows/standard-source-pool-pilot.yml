name: ROPEJUMP standard source-pool pilot

on:
  push:
    paths:
      - ".github/workflows/standard-source-pool-pilot.yml"
      - "research/source-pools-standard.json"
      - "scripts/standard-source-pool-discovery.py"

permissions:
  contents: read
  actions: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Crawl specialist/official source pools conservatively
        run: |
          set -Eeuo pipefail
          python scripts/standard-source-pool-discovery.py --config research/source-pools-standard.json --out out --pilot-limit 30
          cat out/summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: standard-source-pool-pilot
          path: out/
          retention-days: 7
