name: ROPEJUMP legacy Dailymotion STANDARD purity review

on:
  push:
    paths:
      - ".github/workflows/legacy-dailymotion-standard-purity.yml"

permissions:
  contents: read
  actions: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
          python -m pip install -q --disable-pip-version-check pillow yt-dlp
      - name: Download exact legacy sources and build dense visual evidence
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import hashlib,json,math,shutil,subprocess
          from pathlib import Path
          from PIL import Image,ImageDraw
          ids=["x8au8pu","x7zay0w","x8by42a"]
          out=Path("out"); out.mkdir()
          rows=[]
          for vid in ids:
              url=f"https://www.dailymotion.com/video/{vid}"
              subprocess.run(["python","-m","yt_dlp","--no-playlist","--no-progress","--retries","3","--fragment-retries","3",
                              "-f","bv*[height<=720]+ba/b[height<=720]","--merge-output-format","mp4",
                              "-o",str(out/(vid+".%(ext)s")),url],check=True)
              candidates=[p for p in out.glob(vid+".*") if p.suffix not in {".part",".json"}]
              src=next((p for p in candidates if p.suffix==".mp4"),candidates[0])
              if src.suffix!=".mp4":
                  dst=out/(vid+".mp4")
                  subprocess.run(["ffmpeg","-hide_banner","-loglevel","error","-y","-i",str(src),"-c","copy",str(dst)],check=True)
                  src.unlink(); src=dst
              sha=hashlib.sha256(src.read_bytes()).hexdigest()
              probe=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_entries","format=duration,size","-show_entries","stream=codec_type,width,height,r_frame_rate","-of","json",str(src)]))
              d=out/(vid+"_evidence"); d.mkdir()
              tmp=d/"frames15"; tmp.mkdir()
              subprocess.run(["ffmpeg","-hide_banner","-loglevel","error","-y","-i",str(src),"-vf","fps=15,scale=640:-2:flags=lanczos","-q:v","2",str(tmp/"f_%05d.jpg")],check=True)
              jpgs=sorted(tmp.glob("*.jpg"))
              def sheets(mode):
                  dest=d/mode; dest.mkdir(); names=[]
                  per=24; cols=4; cw=340; ch=300 if mode=="full" else 260
                  for st in range(0,len(jpgs),per):
                      chunk=jpgs[st:st+per]; rr=math.ceil(len(chunk)/cols)
                      canvas=Image.new("RGB",(cols*cw,rr*ch),"white"); draw=ImageDraw.Draw(canvas)
                      for j,p in enumerate(chunk):
                          im=Image.open(p).convert("RGB")
                          if mode=="lower":
                              w,h=im.size; im=im.crop((0,int(h*.32),w,h))
                          im.thumbnail((330,250 if mode=="full" else 220))
                          x=(j%cols)*cw+(cw-im.width)//2; y=(j//cols)*ch+30+(230-im.height)//2
                          canvas.paste(im,(x,y))
                          n=int(p.stem.split("_")[-1]); draw.text(((j%cols)*cw+6,(j//cols)*ch+6),f"{(n-1)/15:.2f}s",fill="black")
                      op=dest/f"sheet_{st//per+1:02d}.jpg"; canvas.save(op,quality=90); names.append(str(op.relative_to(out)))
                  return names
              full=sheets("full"); lower=sheets("lower"); shutil.rmtree(tmp)
              rows.append({"id":vid,"sourceRef":url,"sha256":sha,"probe":probe,"visualEvidenceFps":15,"fullSheets":full,"lowerSheets":lower,"typeStatus":"NEED_GPT_DIRECT_VISUAL_REVIEW","autoPass":False})
          (out/"review-manifest.json").write_text(json.dumps({"schemaVersion":1,"targetType":"STANDARD_BASIC_SINGLE_UNDER","purpose":"resolve legacy GPT-counted Dailymotion type purity only","noAutoPass":True,"rows":rows},indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-dailymotion-standard-purity
          path: out/
          retention-days: 2
          compression-level: 0
