name: ROPEJUMP Vimeo search probe

on:
  push:
    paths:
      - ".github/workflows/vimeo-search-probe.yml"

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install yt-dlp
        run: python -m pip install -q --disable-pip-version-check yt-dlp

      - name: Probe Vimeo-native search
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p out
          set +e
          python -m yt_dlp --flat-playlist --dump-json "vimeosearch20:jump rope basic bounce" > out/yt-dlp-search.jsonl 2> out/yt-dlp-search.err
          echo $? > out/yt-dlp-search.code
          set -e
          python - <<'PY'
          import json, re, urllib.parse, urllib.request
          from pathlib import Path
          q="jump rope basic bounce"
          url="https://vimeo.com/search?"+urllib.parse.urlencode({"q":q})
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
          try:
              with urllib.request.urlopen(req,timeout=20) as r:
                  raw=r.read().decode("utf-8","replace")
                  status=getattr(r,"status",200)
              Path("out/vimeo-search.html").write_text(raw)
              ids=[]
              for m in re.finditer(r'https://vimeo\.com/(\d{6,12})',raw):
                  ids.append(m.group(1))
              for m in re.finditer(r'"clip_id"\s*:\s*(\d{6,12})',raw):
                  ids.append(m.group(1))
              seen=[]
              for x in ids:
                  if x not in seen: seen.append(x)
              Path("out/vimeo-search-summary.json").write_text(json.dumps({
                  "status":status,"bytes":len(raw.encode()),"uniqueVideoIds":seen[:100],
                  "count":len(seen)
              },indent=2))
          except Exception as e:
              Path("out/vimeo-search-summary.json").write_text(json.dumps({"error":repr(e)},indent=2))
          PY
          cat out/yt-dlp-search.code
          cat out/yt-dlp-search.err || true
          cat out/vimeo-search-summary.json

      - uses: actions/upload-artifact@v4
        with:
          name: vimeo-search-probe
          path: out/
          retention-days: 2
