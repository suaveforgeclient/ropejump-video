name: ROPEJUMP UCF101 STANDARD remaining c05 batch2

on:
  push:
    paths:
      - ".github/workflows/ucf101-standard-remaining-c05-batch2.yml"

permissions:
  contents: read
  actions: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
          python -m pip install -q --disable-pip-version-check pillow remotezip
      - name: Collect exact unreviewed c05 batch2
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import hashlib,json,math,shutil,subprocess
          from pathlib import Path
          from remotezip import RemoteZip
          from PIL import Image,ImageDraw
          URL="https://huggingface.co/datasets/bitmind/UCF101Fullvideo/resolve/main/UCF101Fullvideo.zip?download=true"
          ids=["v_JumpRope_g12_c05","v_JumpRope_g16_c05","v_JumpRope_g17_c05","v_JumpRope_g18_c05","v_JumpRope_g20_c05","v_JumpRope_g21_c05"]
          target={x+".avi":x for x in ids}
          out=Path("collected"); out.mkdir(exist_ok=True); rows=[]
          with RemoteZip(URL) as rz:
            for entry in rz.namelist():
              name=entry.rsplit("/",1)[-1]
              if name not in target or "/JumpRope/" not in entry: continue
              data=rz.read(entry); (out/name).write_bytes(data)
              rows.append({"id":target[name],"filename":name,"archiveEntry":entry,"sha256":hashlib.sha256(data).hexdigest(),"bytes":len(data),"sourceRef":URL+"#entry="+entry,"typeStatus":"NEED_VISUAL_REVIEW","countStatus":"NOT_REVIEWED","autoPass":False})
          rows.sort(key=lambda x:x["id"])
          Path("manifest.json").write_text(json.dumps({"schemaVersion":1,"targetType":"STANDARD_BASIC_SINGLE_UNDER","selection":"EXACT_UNREVIEWED_C05_BATCH2_FROM_COVERAGE_INVENTORY","rows":rows},indent=2)+"\n")
          ev=Path("review-evidence"); ev.mkdir(exist_ok=True); rev=[]
          for row in rows:
            src=out/row["filename"]; d=ev/src.stem; d.mkdir(parents=True,exist_ok=True); tmp=d/"frames15"; tmp.mkdir()
            subprocess.run(["ffmpeg","-hide_banner","-loglevel","error","-y","-i",str(src),"-vf","fps=15,scale=640:-2:flags=lanczos","-q:v","2",str(tmp/"f_%05d.jpg")],check=True)
            jpgs=sorted(tmp.glob("*.jpg"))
            def mk(mode):
              dest=d/mode; dest.mkdir(); names=[]; per=24; cols=4; cw=340; ch=300 if mode=="full" else 260
              for st in range(0,len(jpgs),per):
                chunk=jpgs[st:st+per]; rr=math.ceil(len(chunk)/cols)
                canvas=Image.new("RGB",(cols*cw,rr*ch),"white"); draw=ImageDraw.Draw(canvas)
                for j,p in enumerate(chunk):
                  im=Image.open(p).convert("RGB")
                  if mode=="lower":
                    w,h=im.size; im=im.crop((0,int(h*.32),w,h))
                  im.thumbnail((330,250 if mode=="full" else 220))
                  x=(j%cols)*cw+(cw-im.width)//2; y=(j//cols)*ch+30+(230-im.height)//2
                  canvas.paste(im,(x,y)); n=int(p.stem.split("_")[-1]); draw.text(((j%cols)*cw+6,(j//cols)*ch+6),f"{(n-1)/15:.2f}s",fill="black")
                op=dest/f"sheet_{st//per+1:02d}.jpg"; canvas.save(op,quality=90); names.append(str(op.relative_to(ev)))
              return names
            full=mk("full"); lower=mk("lower"); shutil.rmtree(tmp)
            rev.append({**row,"visualEvidenceFps":15,"fullSheets":full,"lowerSheets":lower})
          (ev/"review-manifest.json").write_text(json.dumps({"schemaVersion":1,"targetType":"STANDARD_BASIC_SINGLE_UNDER","noAutoPass":True,"countOnlyAfterWholeSourceVisualPass":True,"rows":rev},indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ucf101-standard-remaining-c05-batch2
          path: |
            manifest.json
            collected/*.avi
            review-evidence/
          retention-days: 2
